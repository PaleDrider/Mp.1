<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" id="theme-color-meta" content="#f0f4f8">
<title>Blueprint Maker</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap');
:root {
  --bg:#0a0e1a;--canvas-bg:#060c1f;--grid-minor:#192038;--grid-major:#1e2d4e;
  --panel:#0d1526;--border:#182540;--btn:#111d33;--btnhov:#182440;--btnact:#1e3a6e;
  --text:#c8d6e5;--dim:#3a5070;--bright:#e8f4fd;
  --accent:#00d4ff;--red:#ef4444;--green:#22c55e;
  --label-bg:rgba(6,12,31,.92);--label-border:#1a2540;--label-text:#c8d6e5;
  --mono:'JetBrains Mono',monospace;
}
[data-theme="light"] {
  --bg:#dce4ee;--canvas-bg:#ffffff;--grid-minor:#b8c8d8;--grid-major:#7a9ab8;
  --panel:#c8d8e8;--border:#6a8aaa;--btn:#b0c8dc;--btnhov:#90adc8;--btnact:#5a85aa;
  --text:#0a1525;--dim:#1e4060;--bright:#050e1a;
  --label-bg:rgba(200,220,240,.97);--label-border:#3a6080;--label-text:#050e1a;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--mono);font-size:12px}
body{display:flex;flex-direction:column}
body.photo-mode #hdr,body.photo-mode #dp,body.photo-mode #sb,body.photo-mode #stbar{display:none!important}
body.photo-mode #main{flex:1}
#hdr{background:var(--panel);border-bottom:1px solid var(--border);padding:4px 8px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;flex-shrink:0;min-height:36px}
h1{font-size:10px;font-weight:600;color:var(--accent);letter-spacing:.2em;text-transform:uppercase;white-space:nowrap}
.sep{width:1px;height:16px;background:var(--border);flex-shrink:0}
.btn{background:var(--btn);border:1px solid var(--border);color:var(--text);padding:3px 8px;border-radius:3px;cursor:pointer;font-family:var(--mono);font-size:10px;transition:all .1s;white-space:nowrap;display:inline-flex;align-items:center;gap:3px;user-select:none}
.btn:hover{background:var(--btnhov);border-color:var(--dim);color:var(--bright)}
.btn.on{background:var(--btnact);border-color:var(--accent);color:var(--accent)}
.btn.red{border-color:#4a1515;color:var(--red)}.btn.red:hover{background:#1a0808;border-color:var(--red)}
.btn.grn{border-color:#1a4a2a;color:var(--green)}
.btn:disabled{opacity:.3;cursor:not-allowed}
.zg{display:flex;align-items:center;gap:1px;background:var(--btn);border:1px solid var(--border);border-radius:3px;padding:0 3px}
.zg button{background:none;border:none;color:var(--text);cursor:pointer;padding:2px 4px;font-size:13px;line-height:1}.zg button:hover{color:var(--accent)}
.zg input{background:none;border:none;color:var(--accent);font-family:var(--mono);font-size:10px;width:42px;text-align:center;outline:none}
select{background:var(--btn);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:10px;padding:2px 5px;border-radius:3px;outline:none;cursor:pointer}
#dp{background:var(--panel);border-bottom:1px solid var(--border);padding:6px 8px;display:none;align-items:flex-end;gap:5px;flex-wrap:wrap;flex-shrink:0}
#dp.on{display:flex}
.stab{padding:2px 8px;border-radius:3px;border:1px solid var(--border);background:var(--btn);color:var(--dim);cursor:pointer;font-size:9px;font-family:var(--mono)}
.stab.on{background:var(--btnact);border-color:var(--accent);color:var(--accent)}
.cg{display:flex;gap:3px;align-items:center}
.cg label{color:var(--dim);font-size:9px;min-width:14px}
.ci{background:var(--btn);border:1px solid var(--border);color:var(--bright);font-family:var(--mono);font-size:11px;padding:2px 5px;border-radius:3px;width:52px;outline:none}
.ci:focus{border-color:var(--accent)}.ci.ok{border-color:#1a4a2a;color:var(--green)}
.arr{color:var(--dim);font-size:10px}
#poly-points{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.poly-pair{display:flex;gap:2px;align-items:center;background:var(--btn);border:1px solid var(--border);border-radius:3px;padding:2px 4px}
.poly-pair label{color:var(--dim);font-size:9px;min-width:12px}
.poly-pair .ci{width:44px}
.poly-pair .del-pt{background:none;border:none;color:var(--dim);cursor:pointer;font-size:10px;padding:0 2px}
.poly-pair .del-pt:hover{color:var(--red)}
#shape-lib{background:var(--panel);border-bottom:1px solid var(--border);padding:6px 8px;display:none;align-items:flex-start;gap:6px;flex-wrap:wrap;flex-shrink:0;max-height:120px;overflow-y:auto}
#shape-lib.on{display:flex}
.lib-item{background:var(--btn);border:1px solid var(--border);border-radius:4px;padding:4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:60px}
.lib-item:hover{border-color:var(--accent)}
.lib-item.sel{border-color:var(--accent);background:var(--btnact)}
.lib-item canvas{border:1px solid var(--dim);border-radius:2px;background:var(--canvas-bg)}
.lib-item span{font-size:8px;color:var(--text);max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.lib-item input{font-size:8px;background:var(--btn);border:1px solid var(--accent);color:var(--bright);border-radius:2px;width:58px;outline:none;font-family:var(--mono)}
#main{flex:1;display:flex;overflow:hidden;min-height:0}
#cwrap{flex:1;overflow:auto;position:relative;cursor:crosshair}
#cwrap.lk{cursor:not-allowed;touch-action:pan-x pan-y}
#ci{position:relative;display:inline-block}
canvas#gc{display:block;position:absolute;top:0;left:0;pointer-events:none}
svg#sv{position:absolute;top:0;left:0;overflow:visible;pointer-events:none}
#dl{position:absolute;top:0;left:0}
#hi{position:absolute;pointer-events:none;display:none;z-index:5}
#sb{width:200px;background:var(--panel);border-left:1px solid var(--border);overflow-y:auto;flex-shrink:0}
#sb.hide{display:none}
.ss2{border-bottom:1px solid var(--border);padding:8px}
.st{font-size:9px;font-weight:600;color:var(--dim);letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px}
.li{padding:4px 6px;border:1px solid transparent;border-radius:3px;cursor:pointer;margin-bottom:2px;transition:all .1s}
.li:hover{background:var(--btn);border-color:var(--border)}
.li.sel{background:var(--btnact);border-color:var(--accent)}
.li-id{font-size:9px;font-weight:600;margin-bottom:2px}
.li-cd{font-size:9px;color:var(--dim);margin-top:1px}
.li-ac{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap;align-items:center}
.mb{background:var(--btn);border:1px solid var(--border);color:var(--dim);padding:1px 5px;border-radius:2px;cursor:pointer;font-family:var(--mono);font-size:9px}
.mb:hover{color:var(--bright);border-color:var(--dim)}
.mb.del:hover{color:var(--red);border-color:#4a1515}
.lsize-wrap{display:flex;align-items:center;gap:4px;font-size:9px;color:var(--dim)}
.lsize-in{background:var(--btn);border:1px solid var(--border);color:var(--bright);font-family:var(--mono);font-size:10px;padding:1px 4px;border-radius:3px;width:50px;outline:none}
.lsize-in:focus{border-color:var(--accent)}
.sc-hex{background:var(--btn);border:1px solid var(--border);color:var(--bright);font-family:var(--mono);font-size:9px;padding:1px 3px;border-radius:2px;width:52px;outline:none}
.sc-hex:focus{border-color:var(--accent)}
.sc-swatch{width:14px;height:14px;border-radius:2px;border:1px solid var(--border);cursor:pointer;flex-shrink:0}
#stbar{background:var(--panel);border-top:1px solid var(--border);padding:2px 8px;display:flex;gap:12px;font-size:9px;color:var(--dim);flex-shrink:0}
#stbar span{color:var(--text)}
#nf{position:fixed;top:40px;right:10px;background:var(--panel);border:1px solid var(--accent);color:var(--accent);padding:4px 10px;border-radius:3px;font-size:10px;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none}
#nf.on{opacity:1}
#photo-hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.5);color:rgba(255,255,255,.5);font-size:10px;padding:4px 12px;border-radius:12px;pointer-events:none;z-index:50;display:none}
body.photo-mode #photo-hint{display:block}
.sa{display:flex;gap:3px}
.sa textarea{background:var(--btn);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:9px;padding:2px 5px;border-radius:3px;width:90px;resize:none;outline:none}
.sa textarea:focus{border-color:var(--accent)}
.num-in{background:var(--btn);border:1px solid var(--border);color:var(--bright);font-family:var(--mono);font-size:10px;padding:2px 5px;border-radius:3px;outline:none;text-align:center}
.num-in:focus{border-color:var(--accent)}
#tb{display:none}
</style>
</head>
<body>
<div id="tb">
  <select id="ls"><option value="solid" selected>Solid</option><option value="dashed">Dashed</option><option value="dotted">Dotted</option></select>
  <input id="hex-in" type="text" value="000000" maxlength="6">
  <div id="cswatch"></div>
</div>
<input type="file" id="file-open" accept=".bm,.json" style="display:none">

<div id="hdr">
  <h1>◈ BLUEPRINT</h1>
  <div class="sep"></div>
  <button class="btn" id="b-draw">✏ Draw</button>
  <button class="btn" id="b-bp">◫ Blueprint</button>
  <button class="btn on" id="b-grid">⊞ Grid</button>
  <button class="btn" id="b-lib">◧ Shapes</button>
  <button class="btn" id="b-lock" title="Lock canvas — prevents accidental drawing while scrolling on mobile">⊘ Lock</button>
  <button class="btn" id="b-photo" title="Photo mode — clean export view">📷</button>
  <button class="btn" id="b-theme" title="Toggle theme">🌙</button>
  <button class="btn" id="b-dim" title="Dim blueprint decorations">◑</button>
  <div class="sep"></div>
  <button class="btn" id="b-undo" disabled>↩</button>
  <button class="btn" id="b-redo" disabled>↪</button>
  <div class="sep"></div>
  <div class="zg">
    <button id="zo">−</button>
    <input id="zi" type="text" value="1.0×">
    <button id="zi2">+</button>
  </div>
  <div class="sep"></div>
  <button class="btn" id="b-len">Lengths</button>
  <button class="btn" id="b-ang">Angles</button>
  <button class="btn" id="b-dots">Dots</button>
  <span style="color:var(--dim);font-size:9px;letter-spacing:.1em">SIZE</span>
  <input class="num-in" id="size-in" type="text" value="50" style="width:44px">
  <button class="btn" id="b-max" title="Fill screen">⤢</button>
  <div class="sep"></div>
  <button class="btn grn" id="b-save">⬆ Copy</button>
  <button class="btn grn" id="b-savefile">⬇ .bm</button>
  <button class="btn" id="b-openfile">📂</button>
  <div class="sa">
    <textarea id="li" rows="1" placeholder="Paste save…"></textarea>
    <button class="btn" id="b-load">⬇</button>
  </div>
  <button class="btn" id="b-png">🖼 PNG</button>
  <button class="btn" id="b-svg">⎘ SVG</button>
  <button class="btn" id="b-sb">≡</button>
</div>

<div id="dp">
  <div id="shape-tabs" style="display:flex;gap:3px">
    <button class="stab on" data-shape="line">LINE</button>
    <button class="stab" data-shape="circle">CIRCLE</button>
    <button class="stab" data-shape="polygon">POLYGON</button>
    <button class="stab" data-shape="arc">ARC</button>
  </div>
  <div class="sep"></div>
  <div id="line-inputs" style="display:flex;gap:5px;align-items:flex-end;flex-wrap:wrap">
    <div class="cg"><label>X1</label><input class="ci" id="x1" placeholder="0"></div>
    <div class="cg"><label>Y1</label><input class="ci" id="y1" placeholder="0"></div>
    <span class="arr">→</span>
    <div class="cg"><label>X2</label><input class="ci" id="x2" placeholder="0"></div>
    <div class="cg"><label>Y2</label><input class="ci" id="y2" placeholder="0"></div>
    <span id="autofill-hint" style="color:var(--green);font-size:9px;align-self:center;display:none">↲ auto-straight</span>
  </div>
  <div id="circle-inputs" style="display:none;gap:5px;align-items:flex-end;flex-wrap:wrap">
    <div class="cg"><label>CX</label><input class="ci" id="cx" placeholder="0"></div>
    <div class="cg"><label>CY</label><input class="ci" id="cy" placeholder="0"></div>
    <div class="cg"><label>R</label><input class="ci" id="cr" placeholder="5"></div>
  </div>
  <div id="polygon-inputs" style="display:none;flex-direction:column;gap:4px">
    <div id="poly-points"></div>
    <div style="display:flex;gap:4px;margin-top:2px">
      <button class="btn" id="b-poly-add">+ Point</button>
      <button class="btn" id="b-poly-close" title="Close polygon">⊙ Close</button>
    </div>
  </div>
  <div id="arc-inputs" style="display:none;gap:5px;align-items:flex-end;flex-wrap:wrap">
    <div class="cg"><label>X1</label><input class="ci" id="ax1" placeholder="0"></div>
    <div class="cg"><label>Y1</label><input class="ci" id="ay1" placeholder="0"></div>
    <span class="arr">→</span>
    <div class="cg"><label>X2</label><input class="ci" id="ax2" placeholder="0"></div>
    <div class="cg"><label>Y2</label><input class="ci" id="ay2" placeholder="0"></div>
    <div class="cg"><label title="Bulge: arc bow distance in cells. + right/up, − left/down">Bulge</label><input class="ci" id="abulge" placeholder="3" style="width:44px"></div>
  </div>
  <button class="btn on" id="b-draw-shape">▶ Draw</button>
  <button class="btn" id="b-clr-c">✕</button>
  <span id="ph" style="color:var(--dim);font-size:9px;font-style:italic;align-self:center">Click grid or dots</span>
</div>

<div id="shape-lib">
  <div id="lib-items" style="display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start"></div>
  <div style="display:flex;flex-direction:column;gap:4px;margin-left:8px">
    <button class="btn grn" id="b-lib-save">+ Save Shape</button>
    <button class="btn" id="b-lib-place">▷ Place</button>
  </div>
</div>

<div id="main">
  <div id="cwrap">
    <div id="ci">
      <canvas id="gc"></canvas>
      <svg id="sv" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="dl"></div>
      <div id="hi">
        <svg width="20" height="20" style="overflow:visible">
          <circle cx="10" cy="10" r="4" fill="none" stroke="var(--accent)" stroke-width="1.2" opacity=".5"/>
          <line x1="10" y1="0" x2="10" y2="20" stroke="var(--accent)" stroke-width=".5" opacity=".35"/>
          <line x1="0" y1="10" x2="20" y2="10" stroke="var(--accent)" stroke-width=".5" opacity=".35"/>
        </svg>
      </div>
    </div>
  </div>
  <div id="sb">
    <div class="ss2">
      <div class="st">Shapes <span id="sc" style="color:var(--accent)">0</span></div>
      <div id="sl"></div>
    </div>
    <div class="ss2">
      <div class="st">Labels</div>
      <div class="lsize-wrap" style="margin-bottom:5px">
        <span>Size (cells):</span>
        <input class="lsize-in" id="label-size" type="text" value="1">
      </div>
      <div style="font-size:9px;color:var(--dim);margin-bottom:4px">Avoid overlap:
        <label style="cursor:pointer"><input type="checkbox" id="label-avoid" checked> on</label>
      </div>
      <div style="font-size:9px;color:var(--dim);margin-bottom:2px">Blueprint label:</div>
      <div style="display:flex;gap:3px">
        <button class="mb on" id="bp-lbl-on" onclick="setBPLabelPos('on')">On line</button>
        <button class="mb" id="bp-lbl-above" onclick="setBPLabelPos('above')">Above</button>
        <button class="mb" id="bp-lbl-below" onclick="setBPLabelPos('below')">Below</button>
      </div>
    </div>
    <div class="ss2">
      <div class="st">Canvas</div>
      <div style="display:flex;flex-direction:column;gap:4px;font-size:10px">
        <div style="display:flex;justify-content:space-between"><span style="color:var(--dim)">Grid</span><span id="i-g">∞</span></div>
        <div style="display:flex;justify-content:space-between"><span style="color:var(--dim)">Zoom</span><span id="i-z" style="color:var(--accent)">1.0×</span></div>
        <div style="display:flex;justify-content:space-between"><span style="color:var(--dim)">Shapes</span><span id="i-s">0</span></div>
      </div>
    </div>
  </div>
</div>

<div id="stbar">
  <div>Grid <span id="s-g">50×50</span></div>
  <div>Zoom <span id="s-z" style="color:var(--accent)">1.0×</span></div>
  <div>Shapes <span id="s-s">0</span></div>
  <div>Cursor <span id="s-c">—</span></div>
</div>
<div id="photo-hint">Double-click or Esc to exit photo mode</div>
<div id="nf"></div>

<script>
const S = {
  shapes:[],shapeLibrary:[],canvasSize:50,zoom:1.0,
  drawMode:false,blueprintMode:false,gridVisible:true,locked:false,
  showLengths:false,showAngles:false,showDots:false,
  theme:'light',lineStyle:'solid',lineColor:'#000000',
  currentShape:'line',
  coords:{x1:'',y1:'',x2:'',y2:''},
  circCoords:{cx:'',cy:'',cr:''},
  arcCoords:{x1:'',y1:'',x2:'',y2:'',bulge:''},
  polyPoints:[{x:'',y:''}],polyClose:false,
  selectedId:null,selectedLibItem:null,
  history:[],historyIdx:-1,nextId:1,
  sidebarOpen:true,libOpen:false,redDot:null,photoMode:false,
  labelSizeCells:1.0,labelAvoid:true,
  bpOpacity:1.0,bpLabelPos:'on',
  _dotA:null,
};

const CELL=20;
const g2p=g=>g*CELL*S.zoom;
const p2g=p=>p/(CELL*S.zoom);
const cpx=()=>Math.ceil(S.canvasSize*CELL*S.zoom);
const GC=document.getElementById('gc');
const SV=document.getElementById('sv');
const DL=document.getElementById('dl');
const CW=document.getElementById('cwrap');
const CI=document.getElementById('ci');
const HI=document.getElementById('hi');
const DP=document.getElementById('dp');

let _nt;
function notify(msg,color){
  const el=document.getElementById('nf');
  el.textContent=msg;el.style.borderColor=color||'var(--accent)';el.style.color=color||'var(--accent)';
  el.classList.add('on');clearTimeout(_nt);_nt=setTimeout(()=>el.classList.remove('on'),2000);
}

function applyTheme(t){
  S.theme=t;
  document.documentElement.setAttribute('data-theme',t==='light'?'light':'');
  document.getElementById('b-theme').textContent=t==='light'?'🌙':'☀';
  document.getElementById('theme-color-meta').content=t==='light'?'#f0f4f8':'#0a0e1a';
  if(S.lineColor==='#000000'||S.lineColor==='#ffffff'||S.lineColor==='#c8d6e5')
    S.lineColor=t==='light'?'#000000':'#ffffff';
  render();
}

function resolveColor(c){
  if(!c||c==='#000000'||c==='#ffffff'||c==='#c8d6e5'){
    if(S.blueprintMode)return S.theme==='light'?'#1a3a5c':'#c8e4f8';
    return S.theme==='light'?'#000000':'#ffffff';
  }
  return c;
}

function saveHist(){
  const snap=JSON.parse(JSON.stringify({shapes:S.shapes,canvasSize:S.canvasSize}));
  S.history=S.history.slice(0,S.historyIdx+1);
  S.history.push(snap);S.historyIdx=S.history.length-1;updHist();
}
function undo(){
  if(S.historyIdx<=0)return;S.historyIdx--;
  const h=S.history[S.historyIdx];
  S.shapes=JSON.parse(JSON.stringify(h.shapes));S.canvasSize=h.canvasSize;
  document.getElementById('size-in').value=S.canvasSize;
  computeRedDot();render();
}
function redo(){
  if(S.historyIdx>=S.history.length-1)return;S.historyIdx++;
  const h=S.history[S.historyIdx];
  S.shapes=JSON.parse(JSON.stringify(h.shapes));S.canvasSize=h.canvasSize;
  document.getElementById('size-in').value=S.canvasSize;
  computeRedDot();render();
}
function updHist(){
  document.getElementById('b-undo').disabled=S.historyIdx<=0;
  document.getElementById('b-redo').disabled=S.historyIdx>=S.history.length-1;
}

function expandIfNeeded(coords){
  const mx=Math.max(...coords.filter(n=>!isNaN(n)));
  if(mx>S.canvasSize-1){S.canvasSize=Math.ceil(mx+2);document.getElementById('size-in').value=S.canvasSize;}
}
function setMaxCanvas(){
  const hh=document.getElementById('hdr').offsetHeight+(S.drawMode?DP.offsetHeight:0)+document.getElementById('stbar').offsetHeight;
  const sw=S.sidebarOpen?document.getElementById('sb').offsetWidth:0;
  const cols=Math.floor((window.innerWidth-sw-2)/(CELL*S.zoom));
  const rows=Math.floor((window.innerHeight-hh-2)/(CELL*S.zoom));
  S.canvasSize=Math.max(10,Math.max(cols,rows));
  document.getElementById('size-in').value=S.canvasSize;render();
}

function renderGrid(){
  const dpr=window.devicePixelRatio||1;
  const sz=cpx();
  GC.width=sz*dpr;GC.height=sz*dpr;
  CI.style.width=sz+'px';CI.style.height=sz+'px';
  SV.setAttribute('width',sz);SV.setAttribute('height',sz);
  SV.style.width=sz+'px';SV.style.height=sz+'px';
  const ctx=GC.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,sz,sz);
  if(S.blueprintMode&&S.theme!=='light'){ctx.fillStyle='#050e2a';ctx.fillRect(0,0,sz,sz);}
  else if(S.theme==='light'){ctx.fillStyle='#ffffff';ctx.fillRect(0,0,sz,sz);}
  if(!S.gridVisible)return;
  const cell=CELL*S.zoom;
  const isLight=S.theme==='light';
  for(let i=0;i<=S.canvasSize;i++){
    const maj=i%5===0;
    ctx.strokeStyle=S.blueprintMode?(isLight?(maj?'#8aaac8':'#b8cfe0'):(maj?'#1a3060':'#0d1f3c')):isLight?(maj?'#b8c6d4':'#dde3ea'):(maj?'#1e2d4e':'#192038');
    ctx.lineWidth=maj?.7:.4;
    const p=i*cell;
    ctx.beginPath();ctx.moveTo(p,0);ctx.lineTo(p,sz);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,p);ctx.lineTo(sz,p);ctx.stroke();
  }
  const fs=Math.max(6,6.5*S.zoom);
  ctx.fillStyle=S.blueprintMode?(isLight?'#5070a0':'#1a3060'):isLight?'#9ab0c4':'#1e2d4e';
  ctx.font=`${fs}px JetBrains Mono,monospace`;
  for(let i=10;i<=S.canvasSize;i+=10){
    const p=i*cell;
    ctx.fillText(i,p+3,fs+3);
    ctx.fillText(i,3,p-3);
  }
}

function computeRedDot(){
  const pts=[];
  S.shapes.forEach(s=>{
    if(s.type==='line'){pts.push({x:s.x1,y:s.y1});pts.push({x:s.x2,y:s.y2});}
    else if(s.type==='circle'){pts.push({x:s.cx,y:s.cy});pts.push({x:s.cx+s.r,y:s.cy});}
    else if(s.type==='polygon')s.pts.forEach(p=>pts.push(p));
    else if(s.type==='arc'){pts.push({x:s.x1,y:s.y1});pts.push({x:s.x2,y:s.y2});}
  });
  if(pts.length<2){S.redDot=null;return;}
  let maxD=0,p1=pts[0],p2=pts[1];
  for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){
    const d=(pts[i].x-pts[j].x)**2+(pts[i].y-pts[j].y)**2;
    if(d>maxD){maxD=d;p1=pts[i];p2=pts[j];}
  }
  S.redDot={x:(p1.x+p2.x)/2,y:(p1.y+p2.y)/2};
}

const placedLabels=[];
function resetLabels(){placedLabels.length=0;}
function rectsOverlap(a,b){return!(a.x+a.w<b.x-4||b.x+b.w<a.x-4||a.y+a.h<b.y-4||b.y+b.h<a.y-4);}

function placeLabel(cx,cy,angle,text,id,color){
  const labelH=S.labelSizeCells*CELL*S.zoom;
  const charW=labelH*0.55;
  const w=text.length*charW+8;
  const h=labelH+4;
  const rad=angle*Math.PI/180;
  const perpX=-Math.sin(rad),perpY=Math.cos(rad);
  const offsets=[h*0.7,-h*0.7,h*1.5,-h*1.5,h*2.5,-h*2.5,0];
  let bestX=cx,bestY=cy-h*0.7;
  if(S.labelAvoid){
    for(const off of offsets){
      const tx=cx+perpX*off-w/2,ty=cy+perpY*off-h/2;
      const nearVert=Math.abs(Math.sin(rad))>0.7;
      const rect={x:tx,y:ty,w:nearVert?h:w,h:nearVert?w:h};
      let ok=true;
      for(const pl of placedLabels){if(rectsOverlap(rect,pl)){ok=false;break;}}
      if(ok){bestX=tx;bestY=ty;break;}
    }
  }else{bestX=cx+perpX*h*0.7-w/2;bestY=cy+perpY*h*0.7-h/2;}
  placedLabels.push({x:bestX,y:bestY,w,h});
  const fo=svgEl('foreignObject',{x:bestX,y:bestY,width:w+20,height:h+8,style:`pointer-events:${S.locked?'none':'all'};overflow:visible`});
  const div=document.createElement('div');
  const fs=Math.max(7,labelH*0.75);
  div.style.cssText=`font-family:JetBrains Mono,monospace;font-size:${fs}px;color:${color||'var(--label-text)'};background:var(--label-bg);padding:1px 4px;border-radius:2px;border:1px solid var(--label-border);white-space:nowrap;cursor:pointer;display:inline-block`;
  div.textContent=text;
  div.onclick=e=>{e.stopPropagation();S.selectedId=id;renderSidebar();};
  fo.appendChild(div);SV.appendChild(fo);
}

function svgEl(tag,attrs){
  const el=document.createElementNS('http://www.w3.org/2000/svg',tag);
  Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));
  return el;
}

function _drawArrow(x,y,ux,uy,color,size){
  const px=-uy,py=ux;
  const bx=x+ux*size,by=y+uy*size;
  const hw=size*0.38;
  const d=`M${x.toFixed(1)},${y.toFixed(1)} L${(bx+px*hw).toFixed(1)},${(by+py*hw).toFixed(1)} L${(bx-px*hw).toFixed(1)},${(by-py*hw).toFixed(1)} Z`;
  SV.appendChild(svgEl('path',{d,fill:color,opacity:S.bpOpacity.toString()}));
}

function renderBPDimension(x1,y1,x2,y2,color,labelText,shapeId){
  const op=S.bpOpacity.toString();
  const dx=x2-x1,dy=y2-y1;
  const len=Math.sqrt(dx*dx+dy*dy)||1;
  const ux=dx/len,uy=dy/len;
  const px=-uy,py=ux;
  const offset=Math.max(22,28*S.zoom);
  const arrowSz=Math.max(4,5*S.zoom);
  const extOvershoot=4;
  const bpC=S.theme==='light'?'#2a5888':'#5090c0';
  const tickC=S.theme==='light'?'#3a6070':'#3a5878';
  const dim_x1=x1+px*offset,dim_y1=y1+py*offset;
  const dim_x2=x2+px*offset,dim_y2=y2+py*offset;
  [[x1,y1],[x2,y2]].forEach(([ex,ey])=>{
    SV.appendChild(svgEl('line',{x1:ex,y1:ey,x2:ex+px*(offset+extOvershoot),y2:ey+py*(offset+extOvershoot),stroke:tickC,'stroke-width':'0.9',opacity:op}));
  });
  if(!labelText){
    SV.appendChild(svgEl('line',{x1:dim_x1+ux*arrowSz,y1:dim_y1+uy*arrowSz,x2:dim_x2-ux*arrowSz,y2:dim_y2-uy*arrowSz,stroke:bpC,'stroke-width':'1','stroke-dasharray':'6,3',opacity:op}));
    _drawArrow(dim_x1,dim_y1,ux,uy,bpC,arrowSz);_drawArrow(dim_x2,dim_y2,-ux,-uy,bpC,arrowSz);return;
  }
  const labelH=S.labelSizeCells*CELL*S.zoom;
  const fs=Math.max(7,labelH*0.75);
  const labelW=labelText.length*fs*0.62+10;
  const halfW=labelW/2;
  const halfLen=len/2;
  const gap=5;
  const cx=(dim_x1+dim_x2)/2,cy=(dim_y1+dim_y2)/2;
  if(S.bpLabelPos==='on'&&halfLen>halfW+gap+arrowSz*1.5){
    SV.appendChild(svgEl('line',{x1:dim_x1+ux*arrowSz,y1:dim_y1+uy*arrowSz,x2:cx-ux*(halfW+gap),y2:cy-uy*(halfW+gap),stroke:bpC,'stroke-width':'1','stroke-dasharray':'6,3',opacity:op}));
    SV.appendChild(svgEl('line',{x1:cx+ux*(halfW+gap),y1:cy+uy*(halfW+gap),x2:dim_x2-ux*arrowSz,y2:dim_y2-uy*arrowSz,stroke:bpC,'stroke-width':'1','stroke-dasharray':'6,3',opacity:op}));
    _drawArrow(dim_x1,dim_y1,ux,uy,bpC,arrowSz);_drawArrow(dim_x2,dim_y2,-ux,-uy,bpC,arrowSz);
    const angle=Math.atan2(dy,dx)*180/Math.PI;
    const g=svgEl('g',{transform:`rotate(${angle},${cx},${cy})`,style:`cursor:pointer;opacity:${op}`});
    g.appendChild(svgEl('rect',{x:cx-halfW-1,y:cy-labelH/2-2,width:labelW+2,height:labelH+4,fill:'var(--label-bg)',rx:'2',ry:'2'}));
    const t=svgEl('text',{x:cx,y:cy,'text-anchor':'middle','dominant-baseline':'central','font-family':'JetBrains Mono,monospace','font-size':fs,fill:color});
    t.textContent=labelText;g.appendChild(t);
    g.onclick=e=>{e.stopPropagation();S.selectedId=shapeId;renderSidebar();};
    SV.appendChild(g);
  }else{
    SV.appendChild(svgEl('line',{x1:dim_x1+ux*arrowSz,y1:dim_y1+uy*arrowSz,x2:dim_x2-ux*arrowSz,y2:dim_y2-uy*arrowSz,stroke:bpC,'stroke-width':'1','stroke-dasharray':'6,3',opacity:op}));
    _drawArrow(dim_x1,dim_y1,ux,uy,bpC,arrowSz);_drawArrow(dim_x2,dim_y2,-ux,-uy,bpC,arrowSz);
    const sign=S.bpLabelPos==='below'?1:-1;
    const offY=sign*(labelH+4);
    const lx=cx-px*offY-halfW,ly=cy-py*offY-labelH/2;
    placedLabels.push({x:lx,y:ly,w:labelW,h:labelH+4});
    const fo=svgEl('foreignObject',{x:lx,y:ly,width:labelW+20,height:labelH+8,style:`pointer-events:${S.locked?'none':'all'};overflow:visible;opacity:${op}`});
    const div=document.createElement('div');
    div.style.cssText=`font-family:JetBrains Mono,monospace;font-size:${fs}px;color:${color};background:var(--label-bg);padding:1px 4px;border-radius:2px;border:1px solid var(--label-border);white-space:nowrap;cursor:pointer;display:inline-block`;
    div.textContent=labelText;
    div.onclick=e=>{e.stopPropagation();S.selectedId=shapeId;renderSidebar();};
    fo.appendChild(div);SV.appendChild(fo);
  }
}

function renderShapes(){
  while(SV.firstChild)SV.removeChild(SV.firstChild);
  resetLabels();
  S.shapes.forEach(s=>{
    const color=resolveColor(s.color||S.lineColor);
    const dash=s.style==='dashed'?'6,3':s.style==='dotted'?'2,4':'';
    if(s.type==='line')renderLine(s,color,dash);
    else if(s.type==='circle')renderCircle(s,color,dash);
    else if(s.type==='polygon')renderPolygon(s,color,dash);
    else if(s.type==='arc')renderArc(s,color,dash);
  });
}

function renderLine(s,color,dash){
  const x1=g2p(s.x1),y1=g2p(s.y1),x2=g2p(s.x2),y2=g2p(s.y2);
  const attrs={x1,y1,x2,y2,stroke:color,'stroke-width':'1.8'};
  if(!S.blueprintMode&&dash)attrs['stroke-dasharray']=dash;
  SV.appendChild(svgEl('line',attrs));
  if(S.blueprintMode&&(S.showLengths||S.showAngles)){
    const angleDeg=Math.round(Math.atan2(-(s.y2-s.y1),s.x2-s.x1)*180/Math.PI);
    const lenVal=parseFloat(s.length);
    let lbl='';
    if(S.showLengths)lbl+=`${(lenVal*10).toFixed(1)}mm`;
    if(S.showLengths&&S.showAngles)lbl+=' ';
    if(S.showAngles)lbl+=`${angleDeg>180?angleDeg-360:angleDeg}°`;
    renderBPDimension(x1,y1,x2,y2,color,s.hideLabel?'':lbl,s.id);
  }else if(S.blueprintMode){
    renderBPDimension(x1,y1,x2,y2,color,'',s.id);
  }else if(!s.hideLabel&&(S.showLengths||S.showAngles)){
    const cx=(x1+x2)/2,cy=(y1+y2)/2;
    const angle=Math.atan2(y2-y1,x2-x1)*180/Math.PI;
    const angleDeg=Math.round(Math.atan2(-(s.y2-s.y1),s.x2-s.x1)*180/Math.PI);
    const lenVal=parseFloat(s.length);
    let lbl='';
    if(S.showLengths)lbl+=lenVal.toFixed(2);
    if(S.showLengths&&S.showAngles)lbl+=' ';
    if(S.showAngles)lbl+=`${angleDeg>180?angleDeg-360:angleDeg}°`;
    placeLabel(cx,cy,angle,lbl,s.id,color);
  }
}

function renderCircle(s,color,dash){
  const cx=g2p(s.cx),cy=g2p(s.cy),r=g2p(s.r);
  const circAttrs={cx,cy,r,fill:'none',stroke:color,'stroke-width':S.blueprintMode?'1.8':'1.5'};
  if(!S.blueprintMode&&dash)circAttrs['stroke-dasharray']=dash;
  SV.appendChild(svgEl('circle',circAttrs));
  if(S.blueprintMode){
    const ex=cx+r;
    const bpC=S.theme==='light'?'#2a5888':'#5090c0';
    const op=S.bpOpacity.toString();
    SV.appendChild(svgEl('line',{x1:cx,y1:cy,x2:ex,y2:cy,stroke:bpC,'stroke-width':'1','stroke-dasharray':'6,3',opacity:op}));
    SV.appendChild(svgEl('circle',{cx,cy,r:2.5,fill:bpC,opacity:op}));
    SV.appendChild(svgEl('line',{x1:ex,y1:cy-6,x2:ex,y2:cy+6,stroke:bpC,'stroke-width':'1',opacity:op}));
    if(!s.hideLabel&&S.showLengths){
      const lbl=`r=${(parseFloat(s.r)*10).toFixed(1)}mm`;
      const fs=Math.max(7,S.labelSizeCells*CELL*S.zoom*0.75);
      const ly=S.bpLabelPos==='below'?cy+12:cy-5;
      const t=svgEl('text',{x:(cx+ex)/2,y:ly,'text-anchor':'middle','font-family':'JetBrains Mono,monospace','font-size':fs,fill:color,opacity:op});
      t.textContent=lbl;SV.appendChild(t);
    }
  }else if(!s.hideLabel&&S.showLengths){
    placeLabel(cx,cy-r-10,0,`r=${s.r}`,s.id,color);
  }
}

function renderArc(s,color,dash){
  const x1=g2p(s.x1),y1=g2p(s.y1),x2=g2p(s.x2),y2=g2p(s.y2);
  const bulge=s.bulge||3;
  const mx=(x1+x2)/2,my=(y1+y2)/2;
  const dx=x2-x1,dy=y2-y1;
  const len=Math.sqrt(dx*dx+dy*dy)||1;
  const px=-dy/len,py=dx/len;
  const bulgeP=bulge*CELL*S.zoom;
  const qx=mx+px*bulgeP,qy=my+py*bulgeP;
  const mainDash=S.blueprintMode?'':(dash||'');
  const attrs={d:`M${x1},${y1} Q${qx},${qy} ${x2},${y2}`,fill:'none',stroke:color,'stroke-width':S.blueprintMode?'1.8':'1.5'};
  if(mainDash)attrs['stroke-dasharray']=mainDash;
  SV.appendChild(svgEl('path',attrs));
  if(!s.hideLabel&&S.showLengths){
    const lbl=S.blueprintMode?`${(parseFloat(s.length)*10).toFixed(1)}mm`:parseFloat(s.length).toFixed(2);
    placeLabel(qx,qy,0,lbl,s.id,color);
  }
}

function renderPolygon(s,color,dash){
  if(!s.pts||s.pts.length<2)return;
  const pts=s.pts.map(p=>({x:g2p(p.x),y:g2p(p.y)}));
  for(let i=0;i<pts.length-1;i++)drawSegment(pts[i].x,pts[i].y,pts[i+1].x,pts[i+1].y,color,dash,s.id,s.hideLabel,i);
  if(s.closed&&pts.length>2){const last=pts[pts.length-1],first=pts[0];drawSegment(last.x,last.y,first.x,first.y,color,dash,s.id,s.hideLabel,pts.length-1);}
}

function drawSegment(x1,y1,x2,y2,color,dash,id,hideLabel,segIdx){
  const mainDash=S.blueprintMode?'':(dash||'');
  const attrs={x1,y1,x2,y2,stroke:color,'stroke-width':S.blueprintMode?'1.8':'1.5'};
  if(mainDash)attrs['stroke-dasharray']=mainDash;
  SV.appendChild(svgEl('line',attrs));
  if(!hideLabel&&S.showLengths){
    const dx=x2-x1,dy=y2-y1;
    const len=Math.sqrt(dx*dx+dy*dy)/(CELL*S.zoom);
    const angle=Math.atan2(dy,dx)*180/Math.PI;
    const lbl=S.blueprintMode?`${(len*10).toFixed(1)}mm`:len.toFixed(2);
    if(S.blueprintMode)renderBPDimension(x1,y1,x2,y2,color,lbl,id+'.'+segIdx);
    else placeLabel((x1+x2)/2,(y1+y2)/2,angle,lbl,id+'.'+segIdx,color);
  }else if(S.blueprintMode){
    renderBPDimension(x1,y1,x2,y2,color,'',id+'.'+segIdx);
  }
}

function _getDotMap(){
  const ptMap=new Map();
  S.shapes.forEach(s=>{
    if(s.type==='line'){ptMap.set(`${s.x1},${s.y1}`,{x:s.x1,y:s.y1});ptMap.set(`${s.x2},${s.y2}`,{x:s.x2,y:s.y2});}
    else if(s.type==='circle'){ptMap.set(`${s.cx},${s.cy}`,{x:s.cx,y:s.cy});ptMap.set(`${s.cx+s.r},${s.cy}`,{x:s.cx+s.r,y:s.cy});}
    else if(s.type==='polygon')s.pts.forEach(p=>ptMap.set(`${p.x},${p.y}`,p));
    else if(s.type==='arc'){ptMap.set(`${s.x1},${s.y1}`,{x:s.x1,y:s.y1});ptMap.set(`${s.x2},${s.y2}`,{x:s.x2,y:s.y2});}
  });
  return ptMap;
}

function snapToDot(gx,gy){
  const snapR=0.7;
  let best=null,bestD=snapR;
  _getDotMap().forEach(pt=>{
    const d=Math.sqrt((pt.x-gx)**2+(pt.y-gy)**2);
    if(d<bestD){bestD=d;best=pt;}
  });
  if(S.redDot){
    const d=Math.sqrt((S.redDot.x-gx)**2+(S.redDot.y-gy)**2);
    if(d<bestD){bestD=d;best=S.redDot;}
  }
  return best;
}

function renderDots(){
  DL.innerHTML='';
  if(!S.drawMode||S.locked||!S.showDots)return;
  const dotA=S._dotA;
  _getDotMap().forEach((pt,key)=>{
    const d=document.createElement('div');
    const isA=dotA&&`${pt.x},${pt.y}`===dotA;
    const isOrange=dotA&&!isA;
    d.style.position='absolute';d.style.borderRadius='50%';d.style.transform='translate(-50%,-50%)';d.style.cursor='pointer';d.style.zIndex='10';
    if(isA)d.style.cssText+='width:13px;height:13px;background:#00d4ff;box-shadow:0 0 8px #00d4ff;border:2px solid #fff;';
    else if(isOrange)d.style.cssText+='width:11px;height:11px;background:#f97316;box-shadow:0 0 6px #f97316;border:2px solid #fff;';
    else d.style.cssText+='width:10px;height:10px;background:#3b82f6;box-shadow:0 0 5px #3b82f6;border:2px solid rgba(255,255,255,.2);';
    d.style.position='absolute';d.style.left=g2p(pt.x)+'px';d.style.top=g2p(pt.y)+'px';
    d.title=`(${pt.x},${pt.y})`;
    d.addEventListener('click',e=>{
      e.stopPropagation();
      if(!dotA){S._dotA=`${pt.x},${pt.y}`;renderDots();}
      else if(isA){S._dotA=null;renderDots();}
      else{
        const[ax,ay]=dotA.split(',').map(parseFloat);
        if(S.currentShape==='line'||S.currentShape==='arc'){
          S.coords={x1:ax.toString(),y1:ay.toString(),x2:pt.x.toString(),y2:pt.y.toString()};
          updateLineInputs();
          if(S.currentShape==='arc')S.arcCoords={x1:ax.toString(),y1:ay.toString(),x2:pt.x.toString(),y2:pt.y.toString(),bulge:'3'};
        }
        S._dotA=null;drawShape();renderDots();
      }
    });
    DL.appendChild(d);
  });
  if(S.redDot){
    const d=document.createElement('div');
    d.style.cssText=`position:absolute;width:13px;height:13px;background:var(--red);box-shadow:0 0 7px var(--red);border:2px solid rgba(255,255,255,.2);border-radius:50%;transform:translate(-50%,-50%);cursor:pointer;z-index:12`;
    d.style.left=g2p(S.redDot.x)+'px';d.style.top=g2p(S.redDot.y)+'px';
    d.title=`Mid (${S.redDot.x.toFixed(2)},${S.redDot.y.toFixed(2)})`;
    d.addEventListener('click',e=>{e.stopPropagation();fillCoord(S.redDot.x,S.redDot.y);});
    DL.appendChild(d);
  }
  DL.style.pointerEvents='all';
}

function fillCoord(x,y){
  const xs=x.toString(),ys=y.toString();
  if(S.currentShape==='line'){
    const c=S.coords;
    if(c.x1===''&&c.y1===''&&c.x2===''&&c.y2==='')setCoords({x1:xs,y1:ys,x2:'',y2:''});
    else if(c.x1!==''&&c.y1!==''&&c.x2===''&&c.y2===''){
      if(xs===c.x1&&ys===c.y1){notify('Same point','#f97316');return;}
      setCoords({...c,x2:xs,y2:ys});
    }else setCoords({x1:xs,y1:ys,x2:'',y2:''});
  }else if(S.currentShape==='circle'){
    const c=S.circCoords;
    if(c.cx===''&&c.cy==='')setCircCoords({cx:xs,cy:ys,cr:c.cr});
    else if(c.cx!==''&&c.cy!==''&&c.cr===''){
      const dist=Math.sqrt((x-parseFloat(c.cx))**2+(y-parseFloat(c.cy))**2).toFixed(2);
      if(parseFloat(dist)===0){notify('Same point','#f97316');return;}
      setCircCoords({...c,cr:dist.toString()});
    }
  }else if(S.currentShape==='arc'){
    const c=S.arcCoords;
    if(c.x1===''&&c.y1===''){S.arcCoords={...c,x1:xs,y1:ys};['ax1','ay1'].forEach(id=>{const el=document.getElementById(id);if(el){el.value=id==='ax1'?xs:ys;el.classList.add('ok');}});}
    else if(c.x1!==''&&c.y1!==''&&c.x2===''&&c.y2===''){S.arcCoords={...c,x2:xs,y2:ys};['ax2','ay2'].forEach(id=>{const el=document.getElementById(id);if(el){el.value=id==='ax2'?xs:ys;el.classList.add('ok');}});}
    else{S.arcCoords={x1:xs,y1:ys,x2:'',y2:'',bulge:c.bulge};['ax1','ay1'].forEach(id=>{const el=document.getElementById(id);if(el){el.value=id==='ax1'?xs:ys;el.classList.add('ok');}});['ax2','ay2'].forEach(id=>{const el=document.getElementById(id);if(el){el.value='';el.classList.remove('ok');}});}
  }else if(S.currentShape==='polygon'){
    const pairs=S.polyPoints;
    const empty=pairs.findIndex(p=>p.x===''||p.y==='');
    if(empty>=0){pairs[empty]={x:xs,y:ys};renderPolyInputs();}
    else{pairs.push({x:xs,y:ys});renderPolyInputs();}
  }
}

function drawShape(){
  if(S.locked)return;
  if(S.currentShape==='line')drawLine();
  else if(S.currentShape==='circle')drawCircle();
  else if(S.currentShape==='polygon')drawPolygon();
  else if(S.currentShape==='arc')drawArc();
}

function drawLine(){
  let{x1,y1,x2,y2}=S.coords;
  const nx1=parseFloat(x1),ny1=parseFloat(y1),nx2=parseFloat(x2),ny2=parseFloat(y2);
  if(!isNaN(nx1)&&!isNaN(nx2)&&nx1!==nx2&&!isNaN(ny1)&&y2==='')y2=ny1.toString();
  if(!isNaN(nx1)&&!isNaN(nx2)&&nx1!==nx2&&!isNaN(parseFloat(y2))&&y1==='')y1=y2;
  if(!isNaN(ny1)&&!isNaN(parseFloat(y2))&&ny1!==parseFloat(y2)&&!isNaN(nx1)&&x2==='')x2=nx1.toString();
  if(!isNaN(ny1)&&!isNaN(parseFloat(y2))&&ny1!==parseFloat(y2)&&!isNaN(parseFloat(x2))&&x1==='')x1=x2;
  if([x1,y1,x2,y2].some(v=>v===''))return;
  const[a1,b1,a2,b2]=[x1,y1,x2,y2].map(parseFloat);
  if([a1,b1,a2,b2].some(isNaN))return;
  if(a1===a2&&b1===b2){notify('Zero-length line','#f97316');return;}
  expandIfNeeded([a1,b1,a2,b2]);
  S.shapes.push({id:S.nextId++,type:'line',x1:a1,y1:b1,x2:a2,y2:b2,length:Math.sqrt((a2-a1)**2+(b2-b1)**2).toFixed(2),color:S.lineColor,style:S.lineStyle,hideLabel:false});
  setCoords({x1:'',y1:'',x2:'',y2:''});computeRedDot();saveHist();render();notify('Line drawn');
}

function drawCircle(){
  const{cx,cy,cr}=S.circCoords;
  if(cx===''||cy===''||cr===''){notify('Need CX CY R','#f97316');return;}
  const[ncx,ncy,nr]=[cx,cy,cr].map(parseFloat);
  if([ncx,ncy,nr].some(isNaN)||nr<=0)return;
  expandIfNeeded([ncx+nr,ncy+nr,ncx-nr,ncy-nr]);
  S.shapes.push({id:S.nextId++,type:'circle',cx:ncx,cy:ncy,r:nr,color:S.lineColor,style:S.lineStyle,hideLabel:false});
  setCircCoords({cx:'',cy:'',cr:''});computeRedDot();saveHist();render();notify('Circle drawn');
}

function drawArc(){
  const c=S.arcCoords;
  if([c.x1,c.y1,c.x2,c.y2].some(v=>v===''))return;
  const[a1,b1,a2,b2,bulge]=[c.x1,c.y1,c.x2,c.y2,c.bulge||'3'].map(parseFloat);
  if([a1,b1,a2,b2].some(isNaN))return;
  if(a1===a2&&b1===b2){notify('Same point','#f97316');return;}
  expandIfNeeded([a1,b1,a2,b2]);
  S.shapes.push({id:S.nextId++,type:'arc',x1:a1,y1:b1,x2:a2,y2:b2,bulge:isNaN(bulge)?3:bulge,length:Math.sqrt((a2-a1)**2+(b2-b1)**2).toFixed(2),color:S.lineColor,style:S.lineStyle,hideLabel:false});
  S.arcCoords={x1:'',y1:'',x2:'',y2:'',bulge:''};
  ['ax1','ay1','ax2','ay2','abulge'].forEach(id=>{const el=document.getElementById(id);if(el){el.value='';el.classList.remove('ok');}});
  computeRedDot();saveHist();render();notify('Arc drawn');
}

function drawPolygon(pts,closed){
  const points=pts||S.polyPoints;const isClose=closed!==undefined?closed:S.polyClose;
  const validPts=points.filter(p=>p.x!==''&&p.y!==''&&!isNaN(parseFloat(p.x))&&!isNaN(parseFloat(p.y))).map(p=>({x:parseFloat(p.x),y:parseFloat(p.y)}));
  if(validPts.length<2){notify('Need ≥2 points','#f97316');return;}
  expandIfNeeded(validPts.flatMap(p=>[p.x,p.y]));
  S.shapes.push({id:S.nextId++,type:'polygon',pts:validPts,closed:isClose,color:S.lineColor,style:S.lineStyle,hideLabel:false});
  S.polyPoints=[{x:'',y:''}];S.polyClose=false;renderPolyInputs();
  computeRedDot();saveHist();render();notify('Polygon drawn');
}

function saveToLibrary(){
  const validPts=S.polyPoints.filter(p=>p.x!==''&&p.y!==''&&!isNaN(parseFloat(p.x))&&!isNaN(parseFloat(p.y))).map(p=>({x:parseFloat(p.x),y:parseFloat(p.y)}));
  if(validPts.length<2){notify('Need ≥2 points','#f97316');return;}
  S.shapeLibrary.push({id:S.nextId++,pts:validPts,closed:S.polyClose,name:`Shape ${S.shapeLibrary.length+1}`});
  renderLibrary();notify('Saved','#22c55e');
}

function drawShapeThumbnail(canvas,sh){
  const ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);
  if(!sh.pts||sh.pts.length<2)return;
  const xs=sh.pts.map(p=>p.x),ys=sh.pts.map(p=>p.y);
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  const rng=Math.max(maxX-minX,maxY-minY)||1;const pad=6;const sc=(Math.min(canvas.width,canvas.height)-pad*2)/rng;
  ctx.strokeStyle='#00d4ff';ctx.lineWidth=1.5;ctx.beginPath();
  sh.pts.forEach((p,i)=>{const px2=(p.x-minX)*sc+pad+(canvas.width-(maxX-minX)*sc)/2;const py2=(p.y-minY)*sc+pad+(canvas.height-(maxY-minY)*sc)/2;i===0?ctx.moveTo(px2,py2):ctx.lineTo(px2,py2);});
  if(sh.closed)ctx.closePath();ctx.stroke();
}
function placeFromLibrary(){
  if(S.selectedLibItem===null){notify('Select a shape first','#f97316');return;}
  const sh=S.shapeLibrary[S.selectedLibItem];
  S.polyPoints=sh.pts.map(p=>({x:p.x.toString(),y:p.y.toString()}));S.polyClose=sh.closed;S.currentShape='polygon';
  document.querySelectorAll('.stab').forEach(t=>t.classList.toggle('on',t.dataset.shape==='polygon'));
  document.getElementById('line-inputs').style.display='none';document.getElementById('circle-inputs').style.display='none';document.getElementById('polygon-inputs').style.display='flex';document.getElementById('arc-inputs').style.display='none';
  renderPolyInputs();notify('Shape loaded — adjust then ▶ Draw');
}

function enterPhotoMode(){
  S.photoMode=true;document.body.classList.add('photo-mode');
  if(S.shapes.length>0){
    const allX=[],allY=[];
    S.shapes.forEach(s=>{
      if(s.type==='line'){allX.push(s.x1,s.x2);allY.push(s.y1,s.y2);}
      else if(s.type==='circle'){allX.push(s.cx-s.r,s.cx+s.r);allY.push(s.cy-s.r,s.cy+s.r);}
      else if(s.type==='polygon')s.pts.forEach(p=>{allX.push(p.x);allY.push(p.y);});
      else if(s.type==='arc'){allX.push(s.x1,s.x2);allY.push(s.y1,s.y2);}
    });
    const minX=Math.min(...allX),maxX=Math.max(...allX),minY=Math.min(...allY),maxY=Math.max(...allY);
    const pad=2;
    S.canvasSize=Math.ceil(Math.max(maxX-minX,maxY-minY))+pad*2+1;
    setTimeout(()=>{CW.scrollLeft=Math.max(0,g2p(minX-pad));CW.scrollTop=Math.max(0,g2p(minY-pad));},50);
  }
  render();
}
function exitPhotoMode(){S.photoMode=false;document.body.classList.remove('photo-mode');document.getElementById('size-in').value=S.canvasSize;render();}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.photoMode)exitPhotoMode();});

function loadData(str){
  try{
    const s=str.indexOf('BLUEPRINTER_LINES_START'),e=str.indexOf('BLUEPRINTER_LINES_END');
    if(s===-1||e===-1)throw 0;
    const data=JSON.parse(str.substring(s+'BLUEPRINTER_LINES_START'.length,e).trim());
    if(Array.isArray(data)){
      S.shapes=data.map(d=>({id:S.nextId++,type:d.type||'line',...(d.type==='circle'?{cx:+d.cx,cy:+d.cy,r:+d.r}:d.type==='polygon'?{pts:d.pts,closed:!!d.closed}:d.type==='arc'?{x1:+d.x1,y1:+d.y1,x2:+d.x2,y2:+d.y2,bulge:d.bulge||3}:{x1:+d.x1,y1:+d.y1,x2:+d.x2,y2:+d.y2,length:Math.sqrt((d.x2-d.x1)**2+(d.y2-d.y1)**2).toFixed(2)}),color:d.color||'#000000',style:d.style||'solid',hideLabel:false}));
    }else{
      if(data.shapes)S.shapes=data.shapes.map(d=>({...d,id:S.nextId++}));
      if(data.library)S.shapeLibrary=data.library;
      if(data.canvasSize){S.canvasSize=data.canvasSize;document.getElementById('size-in').value=S.canvasSize;}
      if(data.theme)applyTheme(data.theme);
    }
    computeRedDot();saveHist();render();notify('Loaded ✓','#22c55e');
  }catch(e){notify('Load failed','#ef4444');}
}

function exportPNG(){
  const dpr=3;
  const sz=cpx();
  const off=document.createElement('canvas');
  off.width=sz*dpr;off.height=sz*dpr;
  const ctx=off.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=S.theme==='light'?'#ffffff':'#060c1f';
  ctx.fillRect(0,0,sz,sz);
  if(S.gridVisible){
    const cell=CELL*S.zoom;const isLight=S.theme==='light';
    for(let i=0;i<=S.canvasSize;i++){
      const maj=i%5===0;
      ctx.strokeStyle=S.blueprintMode?(isLight?(maj?'#8aaac8':'#b8cfe0'):(maj?'#1a3060':'#0d1f3c')):isLight?(maj?'#b8c6d4':'#dde3ea'):(maj?'#1e2d4e':'#192038');
      ctx.lineWidth=maj?.7:.4;
      const p=i*cell;ctx.beginPath();ctx.moveTo(p,0);ctx.lineTo(p,sz);ctx.stroke();
      ctx.beginPath();ctx.moveTo(0,p);ctx.lineTo(sz,p);ctx.stroke();
    }
  }
  const svgStr=new XMLSerializer().serializeToString(SV);
  const blob=new Blob([svgStr],{type:'image/svg+xml'});
  const url=URL.createObjectURL(blob);
  const img=new Image();
  img.onload=()=>{
    ctx.drawImage(img,0,0,sz,sz);
    const link=document.createElement('a');link.download=`blueprint_${Date.now()}.png`;link.href=off.toDataURL('image/png',1.0);
    document.body.appendChild(link);link.click();document.body.removeChild(link);
    URL.revokeObjectURL(url);notify('PNG saved (3×)','#22c55e');
  };
  img.src=url;
}

function exportSvg(){
  const sz=S.canvasSize*CELL;
  const bg=S.theme==='light'?'#ffffff':'#060c1f';
  const gc=S.theme==='light'?'#dde3ea':'#192038';
  let out=`<svg xmlns="http://www.w3.org/2000/svg" width="${sz}" height="${sz}" style="background:${bg}"><defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0L0 0 0 20" fill="none" stroke="${gc}" stroke-width=".5"/></pattern></defs><rect width="${sz}" height="${sz}" fill="url(#g)"/>`;
  S.shapes.forEach(s=>{
    const c=s.color||'#000000';const d=s.style==='dashed'?'stroke-dasharray="6,3"':s.style==='dotted'?'stroke-dasharray="2,4"':'';
    if(s.type==='line')out+=`<line x1="${s.x1*20}" y1="${s.y1*20}" x2="${s.x2*20}" y2="${s.y2*20}" stroke="${c}" stroke-width="1.5" ${d}/>`;
    else if(s.type==='circle')out+=`<circle cx="${s.cx*20}" cy="${s.cy*20}" r="${s.r*20}" fill="none" stroke="${c}" stroke-width="1.5" ${d}/>`;
    else if(s.type==='polygon'&&s.pts){
      const pts2=s.pts.map(p=>`${p.x*20},${p.y*20}`).join(' ');
      out+=`<polyline points="${pts2}" fill="none" stroke="${c}" stroke-width="1.5" ${d}${s.closed?' stroke-linejoin="round"':''}/>`;
      if(s.closed&&s.pts.length>2){const l=s.pts[s.pts.length-1],f=s.pts[0];out+=`<line x1="${l.x*20}" y1="${l.y*20}" x2="${f.x*20}" y2="${f.y*20}" stroke="${c}" stroke-width="1.5" ${d}/>`;}
    }else if(s.type==='arc'){
      const mx=(s.x1+s.x2)/2,my=(s.y1+s.y2)/2;
      const dx=s.x2-s.x1,dy=s.y2-s.y1,len=Math.sqrt(dx*dx+dy*dy)||1;
      const px=-dy/len,py=dx/len,bp=s.bulge*20;
      out+=`<path d="M${s.x1*20},${s.y1*20} Q${(mx+px*bp)*1},${(my+py*bp)*1} ${s.x2*20},${s.y2*20}" fill="none" stroke="${c}" stroke-width="1.5" ${d}/>`;
    }
  });
  out+='</svg>';
  navigator.clipboard.writeText(out).then(()=>notify('SVG copied ✓','#22c55e')).catch(()=>notify('Failed','#ef4444'));
}

  const now=Date.now();if(now-_lastClick<500)return;_lastClick=now;
  const r=CW.getBoundingClientRect();
  let gx=p2g(e.clientX-r.left+CW.scrollLeft),gy=p2g(e.clientY-r.top+CW.scrollTop);
  const snap=snapToDot(Math.round(gx),Math.round(gy));
  if(snap){gx=snap.x;gy=snap.y;}else{gx=Math.round(gx);gy=Math.round(gy);}
  if(gx<0||gy<0||gx>S.canvasSize||gy>S.canvasSize)return;
  if(S._dotA){S._dotA=null;renderDots();return;}
  fillCoord(gx,gy);
});
CW.addEventListener('touchend',e=>{
  if(!S.drawMode||S.locked||e.touches.length!==0||e.changedTouches.length!==1)return;
  const now=Date.now();if(now-_lastClick<500)return;_lastClick=now;_touchFired=true;setTimeout(()=>{_touchFired=false;},600);
  const t=e.changedTouches[0],r=CW.getBoundingClientRect();
  let gx=p2g(t.clientX-r.left+CW.scrollLeft),gy=p2g(t.clientY-r.top+CW.scrollTop);
  const snap=snapToDot(Math.round(gx),Math.round(gy));
  if(snap){gx=snap.x;gy=snap.y;}else{gx=Math.round(gx);gy=Math.round(gy);}
  if(gx>=0&&gy>=0&&gx<=S.canvasSize&&gy<=S.canvasSize)fillCoord(gx,gy);
},{passive:true});
CW.addEventListener('mousemove',e=>{
  if(!S.drawMode){HI.style.display='none';return;}
  const r=CW.getBoundingClientRect();
  const gx=Math.round(p2g(e.clientX-r.left+CW.scrollLeft)),gy=Math.round(p2g(e.clientY-r.top+CW.scrollTop));
  HI.style.display='block';HI.style.left=(g2p(gx)-10)+'px';HI.style.top=(g2p(gy)-10)+'px';
  document.getElementById('s-c').textContent=`(${gx},${gy})`;
});
CW.addEventListener('mouseleave',()=>{HI.style.display='none';document.getElementById('s-c').textContent='—';});

const tog=(id,key)=>{S[key]=!S[key];document.getElementById(id).classList.toggle('on',S[key]);};
document.getElementById('b-draw').addEventListener('click',()=>{tog('b-draw','drawMode');DP.classList.toggle('on',S.drawMode);if(!S.drawMode)HI.style.display='none';renderDots();});
document.getElementById('b-bp').addEventListener('click',()=>{tog('b-bp','blueprintMode');render();});
document.getElementById('b-grid').addEventListener('click',()=>{tog('b-grid','gridVisible');render();});
document.getElementById('b-lib').addEventListener('click',()=>{tog('b-lib','libOpen');document.getElementById('shape-lib').classList.toggle('on',S.libOpen);renderLibrary();});
document.getElementById('b-lock').addEventListener('click',()=>{
  S.locked=!S.locked;const b=document.getElementById('b-lock');
  b.classList.toggle('on',S.locked);b.classList.toggle('red',S.locked);
  b.textContent=S.locked?'⊗ Locked':'⊘ Lock';
  CW.classList.toggle('lk',S.locked);
  if(S.locked)CW.style.touchAction='pan-x pan-y';else CW.style.touchAction='';
  notify(S.locked?'Locked — scroll freely on mobile':'Unlocked');
  render();
});
document.getElementById('b-photo').addEventListener('click',()=>{if(S.photoMode)exitPhotoMode();else enterPhotoMode();});
document.getElementById('b-theme').addEventListener('click',()=>applyTheme(S.theme==='dark'?'light':'dark'));
document.getElementById('b-dim').addEventListener('click',()=>{
  S.bpOpacity=S.bpOpacity>0.5?0.3:1.0;document.getElementById('b-dim').classList.toggle('on',S.bpOpacity<0.5);render();
});
document.getElementById('b-undo').addEventListener('click',undo);
document.getElementById('b-redo').addEventListener('click',redo);
document.getElementById('b-save').addEventListener('click',saveData);
document.getElementById('b-savefile').addEventListener('click',saveFile);
document.getElementById('b-openfile').addEventListener('click',()=>document.getElementById('file-open').click());
document.getElementById('file-open').addEventListener('change',e=>{
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();reader.onload=ev=>loadData(ev.target.result);reader.readAsText(file);
  e.target.value='';
});
document.getElementById('b-load').addEventListener('click',()=>{const v=document.getElementById('li').value.trim();if(v){loadData(v);document.getElementById('li').value='';}});
document.getElementById('li').addEventListener('paste',e=>{setTimeout(()=>{const v=e.target.value.trim();if(v.includes('BLUEPRINTER_LINES_START')){loadData(v);e.target.value='';}},10);});
document.getElementById('b-png').addEventListener('click',exportPNG);
document.getElementById('b-svg').addEventListener('click',exportSvg);
document.getElementById('b-sb').addEventListener('click',()=>{S.sidebarOpen=!S.sidebarOpen;document.getElementById('sb').classList.toggle('hide',!S.sidebarOpen);});
document.getElementById('b-draw-shape').addEventListener('click',drawShape);
document.getElementById('b-clr-c').addEventListener('click',()=>{setCoords({x1:'',y1:'',x2:'',y2:''});setCircCoords({cx:'',cy:'',cr:''});S.arcCoords={x1:'',y1:'',x2:'',y2:'',bulge:''};S.polyPoints=[{x:'',y:''}];renderPolyInputs();});
document.getElementById('b-max').addEventListener('click',()=>{setMaxCanvas();saveHist();});
document.getElementById('b-len').addEventListener('click',()=>{tog('b-len','showLengths');render();});
document.getElementById('b-ang').addEventListener('click',()=>{tog('b-ang','showAngles');render();});
document.getElementById('b-dots').addEventListener('click',()=>{tog('b-dots','showDots');renderDots();});
document.getElementById('b-poly-add').addEventListener('click',()=>{S.polyPoints.push({x:'',y:''});renderPolyInputs();});
document.getElementById('b-poly-close').addEventListener('click',()=>{S.polyClose=!S.polyClose;document.getElementById('b-poly-close').classList.toggle('on',S.polyClose);});
document.getElementById('b-lib-save').addEventListener('click',saveToLibrary);
document.getElementById('b-lib-place').addEventListener('click',placeFromLibrary);
document.getElementById('size-in').addEventListener('change',e=>{const v=parseInt(e.target.value);if(!isNaN(v)&&v>=1){S.canvasSize=Math.min(v,9999);render();}else e.target.value=S.canvasSize;});
document.getElementById('size-in').addEventListener('keydown',e=>{if(e.key==='Enter')e.target.blur();});
document.getElementById('label-size').addEventListener('change',e=>{const v=parseFloat(e.target.value);if(!isNaN(v)&&v>0)S.labelSizeCells=v;else e.target.value=S.labelSizeCells;render();});
document.getElementById('label-avoid').addEventListener('change',e=>{S.labelAvoid=e.target.checked;render();});
document.getElementById('ls').addEventListener('change',e=>S.lineStyle=e.target.value);

document.querySelectorAll('.stab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.stab').forEach(x=>x.classList.remove('on'));t.classList.add('on');S.currentShape=t.dataset.shape;
  document.getElementById('line-inputs').style.display=S.currentShape==='line'?'flex':'none';
  document.getElementById('circle-inputs').style.display=S.currentShape==='circle'?'flex':'none';
  document.getElementById('polygon-inputs').style.display=S.currentShape==='polygon'?'flex':'none';
  document.getElementById('arc-inputs').style.display=S.currentShape==='arc'?'flex':'none';
  const hints={line:'Click grid to place points',circle:'Click center then edge for radius',polygon:'Click points, + to add more, ⊙ to close',arc:'X1 Y1 → X2 Y2 + Bulge (cells, + or −)'};
  document.getElementById('ph').textContent=hints[S.currentShape]||'';
  renderDots();
}));

['x1','y1','x2','y2'].forEach(f=>{
  const el=document.getElementById(f);if(!el)return;
  el.addEventListener('input',e=>{const v=e.target.value;if(v===''||/^-?\d*\.?\d*$/.test(v)){S.coords[f]=v;el.classList.toggle('ok',v!=='');updateLineInputs();}else e.target.value=S.coords[f];});
  el.addEventListener('keydown',e=>{if(e.key==='Enter')drawShape();});
});
['cx','cy','cr'].forEach(f=>{
  const el=document.getElementById(f);if(!el)return;
  el.addEventListener('input',e=>{const v=e.target.value;if(v===''||/^-?\d*\.?\d*$/.test(v)){S.circCoords[f]=v;el.classList.toggle('ok',v!=='');}else e.target.value=S.circCoords[f];});
  el.addEventListener('keydown',e=>{if(e.key==='Enter')drawShape();});
});
['ax1','ay1','ax2','ay2','abulge'].forEach(f=>{
  const el=document.getElementById(f);if(!el)return;
  const realKey=f==='abulge'?'bulge':f.substring(1);
  el.addEventListener('input',e=>{const v=e.target.value;if(v===''||/^-?\d*\.?\d*$/.test(v)){S.arcCoords[realKey]=v;el.classList.toggle('ok',v!=='');}else e.target.value=S.arcCoords[realKey];});
  el.addEventListener('keydown',e=>{if(e.key==='Enter')drawShape();});
});

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});

function render(){renderGrid();renderShapes();renderDots();renderSidebar();updHist();}

renderPolyInputs();
applyTheme('light');
saveHist();
</script>
</body>
</html>
